name: CI

# develop / main に入る変更を、マージ前に必ず一度は実行する。
# ローカルの node_modules には package.json が宣言していないパッケージが残ることがあり、
# 「手元では通る」は根拠にならない。CI は npm ci（ロックファイルどおりの新規インストール）で確かめる。
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 同じブランチに続けて push したら、古い実行は打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # ツールチェーンの Node は .nvmrc で一元管理する（workerd のバージョンとは無関係）。
          node-version-file: .nvmrc
          cache: npm

      # postinstall で workerd のバイナリが入る。これが無いと worker のテストが動かない。
      - run: npm ci

      - name: 型検査
        run: npm run typecheck

      # ACE Playbook の frontmatter（ace_entry_count / version ↔ Changelog / changeImpact）が
      # 実態からドリフトしていないかを検証する。/ace-curate は develop へ直 push するため、
      # PR だけを見張っても捕まらない — 上の on: に push が含まれているのがこのゲートの前提。
      # 数秒で終わるのでテスト・ビルドより前に置く（文書のドリフトだけで待たされないように）。
      - name: ACE Playbook の frontmatter 検証
        run: npm run ace:check-playbook-frontmatter

      # CLAUDE.md と AGENTS.md は同じ指示を 2 つ持つ写しである（どちらも単独で完結していないと
      # いけないので、共通部分を別ファイルへ切り出せない）。写しは黙ってずれ、実際に片方にしか
      # 無い指示が生まれていた（Issue #136）。マーカー以降が一字一句同じかを機械で照合する。
      - name: CLAUDE.md / AGENTS.md の同期検証
        run: npm run docs:check-agents-sync

      # ACE エントリの形式ゲート（Issue #102）。旧テーブル形式の新規追記を発生源で止める。
      # 既存の旧形式エントリは docs/08-knowledge/legacy-format-allowlist.txt で読み取り互換として通す。
      - name: ACE エントリの形式検証
        run: npm run ace:check-entry-format

      # src/ は jsdom、worker/ は workerd。1コマンドで両方走る。
      - name: テスト
        run: npm test

      # 型もテストも通るのにビルドで落ちる構成ミスを、デプロイ前に捕まえる。
      - name: ビルド
        run: npm run build
